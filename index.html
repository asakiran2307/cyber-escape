<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Campus Cyber Escape: Operation Blackout Protocol - An immersive 4-station physical and digital cybersecurity escape investigation." />
  <title>CAMPUS CYBER ESCAPE // BLACKOUT PROTOCOL</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Cyber Operations Center (SOC) Navigation Bar -->
  <header class="soc-header">
    <div class="brand-section">
      <div class="brand-logo">
        <svg width="18" height="18" fill="#ffffff" viewBox="0 0 16 16">
          <path d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.464 9.99 1.694 2.216 3.71 3.14 4.395 3.318.685-.178 2.7-.102 4.395-3.318 1.677-2.195 3.06-5.513 2.464-9.99A1.54 1.54 0 0 0 13.815 1.43c-.658-.215-1.777-.57-2.887-.87C9.843.266 8.69 0 8 0zm0 1.072c.64 0 1.745.258 2.802.542.997.268 1.98.58 2.57.773.492 3.96-.583 6.942-2.072 8.905-1.398 1.842-3.03 2.652-3.3 2.766-.27-.114-1.902-.924-3.3-2.766C3.209 9.329 2.134 6.347 2.626 2.387c.59-.193 1.573-.505 2.57-.773C6.255 1.33 7.36 1.072 8 1.072z"/>
        </svg>
      </div>
      <div>
        <h1 class="brand-title">BLACKOUT PROTOCOL</h1>
        <div class="brand-subtitle">Campus Cyber Operations Center</div>
      </div>
    </div>

    <!-- Live Telemetry Badges -->
    <div class="hud-telemetry">
      <div class="telemetry-pill">
        <span class="label">AGENT:</span>
        <span id="hudCallsign" class="val">UNREGISTERED</span>
      </div>
      <div class="telemetry-pill">
        <span class="label">PRN:</span>
        <span id="hudPRN" class="val">------</span>
      </div>
      <div class="telemetry-pill">
        <span class="label">PROFILE:</span>
        <span id="hudCase" class="val">------</span>
      </div>
      <div class="telemetry-pill timer-pill">
        <span class="label">CLOCK:</span>
        <span id="hudTimer" class="val">08:00</span>
      </div>
      <div class="telemetry-pill threat-pill">
        <span class="label">STATUS:</span>
        <span id="hudThreat" class="val">STANDBY</span>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="hud-actions">
      <button id="btnToggleAudio" class="btn-cyber-sm">🔊 AUDIO: ON</button>
      <button id="btnOpenAdmin" onclick="if(window.AdminPortal) window.AdminPortal.open();" class="btn-cyber-sm" style="border-color:var(--neon-cyan);background:rgba(0,240,255,0.15)">
        🛡️ ADMIN LOGIN
      </button>
    </div>
  </header>

  <!-- Main Game Container -->
  <main class="main-wrapper">
    <!-- 4-Station Progression Breadcrumbs -->
    <section class="round-tracker-bar" aria-label="Investigation Progression">
      <div id="trackNode1" class="tracker-node locked">
        <div class="node-num">STATION 01</div>
        <div class="node-name">Spoofed Origin</div>
        <div class="node-status">LOCKED</div>
      </div>
      <div id="trackNode2" class="tracker-node locked">
        <div class="node-num">STATION 02</div>
        <div class="node-name">Digital Shadow</div>
        <div class="node-status">LOCKED</div>
      </div>
      <div id="trackNode3" class="tracker-node locked">
        <div class="node-num">STATION 03</div>
        <div class="node-name">Domain Mirage</div>
        <div class="node-status">LOCKED</div>
      </div>
      <div id="trackNode4" class="tracker-node locked">
        <div class="node-num">STATION 04</div>
        <div class="node-name">10-Min Blackout</div>
        <div class="node-status">LOCKED</div>
      </div>
    </section>

    <!-- Dynamic Station / Registration Viewport -->
    <section id="stationContainer" aria-live="polite">
      <!-- Injected dynamically by app.js -->
    </section>

    <!-- Bottom Station Quick Dock & Gatekeeper -->
    <nav class="station-dock-nav" aria-label="Station Navigation">
      <div class="dock-label">STATION GATES:</div>
      <button id="dockNode1" class="dock-station-btn active" data-station="1">
        <span class="dock-icon">1️⃣</span>
        <span class="dock-text">STATION 01</span>
      </button>
      <button id="dockNode2" class="dock-station-btn locked" data-station="2">
        <span class="dock-icon">🔒</span>
        <span class="dock-text">STATION 02</span>
      </button>
      <button id="dockNode3" class="dock-station-btn locked" data-station="3">
        <span class="dock-icon">🔒</span>
        <span class="dock-text">STATION 03</span>
      </button>
      <button id="dockNode4" class="dock-station-btn locked" data-station="4">
        <span class="dock-icon">🔒</span>
        <span class="dock-text">STATION 04</span>
      </button>
    </nav>
  </main>

  <!-- Container for printing A4 physical QR posters -->
  <div id="posterPrintContainer" class="poster-print-container"></div>

  <!-- JavaScript Modules -->
  <script src="crypto.js"></script>
  <script src="cases.js"></script>
  <script src="qr-poster.js"></script>
  <script src="blackout-app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
